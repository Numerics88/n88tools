# This workflow builds and publishes the conda package to the friedchickean channel
# Used for testing purposes only
name: Conda upload to test channel

on:
    push:
        branches:
          - kean/pistoia-fix
    workflow_dispatch:

jobs:
    build-and-publish:
        name: Conda deployment
        runs-on: ${{ matrix.os }}
        strategy:
          matrix:
            os: ["macos-latest", "ubuntu-latest"]
            python-minor-version: [12]

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4
            with:
              ref: master
              fetch-depth: 0

          - name: Build and publish
            uses: openalea/action-build-publish-anaconda@v0.1.5
            with:
              conda: conda-recipe/n88tools
              mamba: false
              python: ${{ matrix.python-minor-version }}
              numpy: '22'
              channels: Numerics88, friedchickean, conda-forge, defaults
              token: ${{ secrets.KEAN_CONDA_TOKEN }}
              publish: true
              label: main